<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>肥鱼 · 鲸鱼娘女仆 3D 换装</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  body { background:linear-gradient(180deg,#0b1026 0%,#16204a 45%,#274b8f 75%,#3d7dd6 100%); }
  #scene { position:fixed; inset:0; }
  #title { position:fixed; top:18px; left:22px; color:#fff; z-index:10; pointer-events:none; text-shadow:0 2px 12px rgba(0,0,0,.5); }
  #title h1 { font-size:22px; font-weight:700; letter-spacing:2px; }
  #title h1 .fish { color:#7fd0ff; }
  #title p { font-size:12px; opacity:.75; margin-top:4px; letter-spacing:1px; }
  #panel {
    position:fixed; right:18px; top:50%; transform:translateY(-50%);
    background:rgba(10,16,38,.72); backdrop-filter:blur(12px);
    border:1px solid rgba(127,208,255,.25); border-radius:16px;
    padding:16px 14px; z-index:10; width:172px;
    box-shadow:0 8px 32px rgba(0,0,0,.45);
  }
  #panel h3 { color:#9fdcff; font-size:13px; margin-bottom:10px; letter-spacing:2px; text-align:center; }
  .outfit-btn {
    display:block; width:100%; margin:8px 0; padding:10px 0;
    border:1px solid rgba(127,208,255,.35); border-radius:10px;
    background:rgba(77,107,254,.15); color:#eaf6ff; font-size:14px; cursor:pointer;
    transition:all .2s; letter-spacing:1px;
  }
  .outfit-btn:hover { background:rgba(77,107,254,.4); transform:translateY(-1px); }
  .outfit-btn.active { background:linear-gradient(135deg,#4d6bfe,#38bdf8); border-color:#9fdcff; font-weight:700; box-shadow:0 0 16px rgba(77,107,254,.6); }
  .row-btns { display:flex; gap:8px; margin-top:10px; }
  .mini-btn {
    flex:1; padding:8px 0; font-size:12px; border-radius:8px; cursor:pointer;
    border:1px solid rgba(127,208,255,.3); background:rgba(255,255,255,.06); color:#cfe9ff;
    transition:all .2s;
  }
  .mini-btn:hover { background:rgba(255,255,255,.15); }
  .mini-btn.on { background:rgba(56,189,248,.35); border-color:#38bdf8; color:#fff; }
  #hint {
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,.55); font-size:12px; z-index:10; pointer-events:none; letter-spacing:1px;
  }
  #loading {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:#9fdcff; font-size:15px; letter-spacing:3px; z-index:20; background:#0b1026;
    transition:opacity .5s;
  }
  @media (max-width:640px){ #panel{ width:140px; right:10px; padding:12px 10px; } #title h1{ font-size:17px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">🐋 正在召唤肥鱼…</div>
<div id="scene"></div>
<div id="title">
  <h1>🐋 <span class="fish">肥鱼</span> · 鲸鱼娘女仆 3D</h1>
  <p>DeepSeek 社区二创形象 · 网页换装版</p>
</div>
<div id="panel">
  <h3>— 换装 —</h3>
  <button class="outfit-btn active" data-outfit="maid">🎀 经典女仆装</button>
  <button class="outfit-btn" data-outfit="whale">🌊 鲸鱼娘装</button>
  <button class="outfit-btn" data-outfit="casual">🍚 休闲居家装</button>
  <div class="row-btns">
    <button class="mini-btn on" id="btnRotate">旋转</button>
    <button class="mini-btn" id="btnWave">招手</button>
  </div>
  <div class="row-btns">
    <button class="mini-btn" id="btnBubbles">泡泡</button>
    <button class="mini-btn" id="btnReset">视角</button>
  </div>
</div>
<div id="hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============ 基础场景 ============ */
const container = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x16204a, 18, 42);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(3.4, 2.9, 6.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.75, 0);
controls.enableDamping = true;
controls.minDistance = 3; controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.55;

/* 灯光 */
scene.add(new THREE.HemisphereLight(0xbdd8ff, 0x1a2340, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(5, 8, 6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6; key.shadow.camera.right = 6;
key.shadow.camera.top = 8; key.shadow.camera.bottom = -2;
scene.add(key);
const rim = new THREE.DirectionalLight(0x66c2ff, 0.9);
rim.position.set(-6, 4, -5); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffe0c0, 0.35);
fill.position.set(-3, 2, 6); scene.add(fill);

/* ============ 材质工具 ============ */
const M = (color, o={}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness:.65, metalness:.05 }, o));
const skinMat  = M(0xffd9c2, { roughness:.55 });
const hairMat  = M(0x2f6bd8, { roughness:.5 });
const hairDark = M(0x1e4aa8, { roughness:.55 });
const hairLite = M(0x7fb2ff, { roughness:.5 });
const whiteMat = M(0xf7f9ff, { roughness:.6 });
const blackMat = M(0x20232e, { roughness:.7 });
const eyeMat   = M(0x1c2b4a, { roughness:.25 });
const hlMat    = new THREE.MeshBasicMaterial({ color:0xffffff });
const blushMat = M(0xff9db0, { roughness:.8 });
const mouthMat = M(0xc25a6b, { roughness:.6 });
const deepBlue = M(0x4d6bfe, { roughness:.6 });

function mesh(geo, mat, x=0, y=0, z=0, shadow=true){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (shadow){ m.castShadow = true; m.receiveShadow = true; }
  return m;
}
function limb(p1, p2, r, mat){
  const a = new THREE.Vector3(...p1), b = new THREE.Vector3(...p2);
  const dir = b.clone().sub(a), len = dir.length();
  const g = new THREE.Group();
  const cyl = mesh(new THREE.CylinderGeometry(r, r*0.85, len, 14), mat);
  cyl.position.copy(a).lerp(b, .5);
  cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  g.add(cyl);
  g.add(mesh(new THREE.SphereGeometry(r, 14, 12), mat, ...a));
  g.add(mesh(new THREE.SphereGeometry(r*0.9, 14, 12), mat, ...b));
  return g;
}
function lathe(pts, mat, seg=28, phiStart=0, phiLen=Math.PI*2){
  const v = pts.map(p => new THREE.Vector2(p[0], p[1]));
  const m = new THREE.Mesh(new THREE.LatheGeometry(v, seg, phiStart, phiLen), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

/* ============ 角色根 ============ */
const feiyu = new THREE.Group();
scene.add(feiyu);
const bodyG = new THREE.Group();
feiyu.add(bodyG);

/* ---- 头 ---- */
const headG = new THREE.Group();
headG.position.set(0, 2.78, 0);
bodyG.add(headG);
headG.add(mesh(new THREE.SphereGeometry(0.42, 32, 24), skinMat));

for (const s of [-1, 1]){
  const eye = mesh(new THREE.SphereGeometry(0.078, 18, 14), eyeMat, s*0.165, 0.03, 0.355);
  eye.scale.set(1, 1.35, 0.55); headG.add(eye);
  headG.add(mesh(new THREE.SphereGeometry(0.026, 10, 8), hlMat, s*0.145, 0.06, 0.415, false));
  const blush = mesh(new THREE.SphereGeometry(0.06, 12, 10), blushMat, s*0.28, -0.12, 0.315, false);
  blush.scale.set(1, 0.6, 0.4); headG.add(blush);
  /* 小圆鳍耳朵（鲸鱼娘特征） */
  const fin = mesh(new THREE.ConeGeometry(0.09, 0.22, 10), hairMat, s*0.44, 0.10, -0.02);
  fin.rotation.z = s * -1.9; headG.add(fin);
}
const mouth = mesh(new THREE.TorusGeometry(0.045, 0.014, 8, 14, Math.PI), mouthMat, 0, -0.185, 0.385, false);
mouth.rotation.z = Math.PI; headG.add(mouth);

/* ---- 头发 ---- */
const hairG = new THREE.Group(); bodyG.add(hairG);
const backHair = mesh(new THREE.SphereGeometry(0.47, 24, 18), hairDark, 0, 2.66, -0.14);
backHair.scale.set(1.02, 1.3, 0.92); hairG.add(backHair);
hairG.add(mesh(new THREE.SphereGeometry(0.45, 24, 18), hairMat, 0, 2.95, -0.03));
for (let i = -2; i <= 2; i++){
  const bang = mesh(new THREE.ConeGeometry(0.085, 0.30, 8), hairMat, i*0.15, 3.02, 0.33);
  bang.rotation.x = 0.5; bang.rotation.z = -i*0.12; hairG.add(bang);
}
const tails = [];
for (const s of [-1, 1]){
  const tg = new THREE.Group(); tg.position.set(s*0.36, 3.02, -0.08); hairG.add(tg);
  tg.add(mesh(new THREE.TorusGeometry(0.075, 0.03, 10, 16), whiteMat));
  let y = -0.10;
  [0.13, 0.115, 0.10, 0.085].forEach((r, i) => {
    tg.add(mesh(new THREE.SphereGeometry(r, 14, 12), hairMat, s*(0.10 + i*0.09), y, -0.02 - i*0.03));
    y -= 0.20;
  });
  const tip = mesh(new THREE.ConeGeometry(0.085, 0.28, 10), hairDark, s*0.46, y + 0.10, -0.14);
  tip.rotation.z = s * 0.5; tg.add(tip);
  tails.push({ g: tg, s });
}

/* ---- 脖子 + 打底躯干 ---- */
bodyG.add(mesh(new THREE.CylinderGeometry(0.11, 0.13, 0.28, 14), skinMat, 0, 2.42, 0));
bodyG.add(mesh(new THREE.CylinderGeometry(0.27, 0.30, 0.75, 18), M(0xf3ede4), 0, 1.98, 0));

/* ---- 手臂（肩关节可动） ---- */
const arms = {};
const armExtras = { maid: [], whale: [], casual: [] };
for (const s of [-1, 1]){
  const sh = new THREE.Group(); sh.position.set(s*0.35, 2.28, 0); bodyG.add(sh);
  sh.add(limb([0, 0.02, 0], [s*0.05, -0.42, 0.02], 0.095, skinMat));
  sh.add(mesh(new THREE.SphereGeometry(0.105, 14, 12), skinMat, s*0.05, -0.46, 0.02));
  sh.rotation.z = s * 0.12;
  const nm = s < 0 ? 'L' : 'R';
  arms[nm] = sh;
  /* 各服装的袖口，平时只显示当前套装的 */
  const cuffM = mesh(new THREE.CylinderGeometry(0.115, 0.125, 0.13, 14), whiteMat, s*0.05, -0.34, 0.02);
  const cuffW = mesh(new THREE.CylinderGeometry(0.115, 0.125, 0.13, 14), hairLite, s*0.05, -0.34, 0.02);
  const cuffC = mesh(new THREE.CylinderGeometry(0.12, 0.13, 0.16, 14), deepBlue, s*0.05, -0.32, 0.02);
  cuffM.visible = cuffW.visible = cuffC.visible = false;
  sh.add(cuffM, cuffW, cuffC);
  armExtras.maid.push(cuffM); armExtras.whale.push(cuffW); armExtras.casual.push(cuffC);
}
/* ---- 腿 + 鞋 ---- */
for (const s of [-1, 1]){
  bodyG.add(limb([s*0.15, 1.62, 0], [s*0.16, 0.42, 0.01], 0.115, skinMat));
  bodyG.add(mesh(new THREE.BoxGeometry(0.20, 0.14, 0.34), blackMat, s*0.16, 0.12, 0.05));
  bodyG.add(mesh(new THREE.BoxGeometry(0.21, 0.05, 0.20), whiteMat, s*0.16, 0.21, -0.03));
}

/* ============ 三套服装 ============ */
const outfits = {};
function newOutfit(name){
  const g = new THREE.Group(); g.visible = false;
  bodyG.add(g); outfits[name] = g; return g;
}

/* ---- 1. 经典女仆装 ---- */
{
  const g = newOutfit('maid');
  g.add(mesh(new THREE.CylinderGeometry(0.27, 0.31, 0.62, 20), blackMat, 0, 2.02, 0));           // 紧身衣
  g.add(lathe([[0.30,1.80],[0.42,1.55],[0.55,1.20],[0.66,0.85],[0.68,0.72]], blackMat));          // 蓬蓬裙
  const hem = mesh(new THREE.TorusGeometry(0.66, 0.05, 10, 32), whiteMat, 0, 0.74, 0);
  hem.rotation.x = Math.PI/2; g.add(hem);                                                        // 裙摆花边
  const apron = lathe([[0.32,1.70],[0.42,1.42],[0.52,1.08],[0.58,0.80]], whiteMat, 24, -0.85, 1.7);
  apron.material = whiteMat.clone(); apron.material.side = THREE.DoubleSide; g.add(apron);       // 围裙
  const bib = mesh(new THREE.BoxGeometry(0.36, 0.34, 0.05), whiteMat, 0, 2.22, 0.27);
  bib.rotation.x = -0.08; g.add(bib);                                                            // 胸前围裙
  const band = mesh(new THREE.TorusGeometry(0.325, 0.028, 10, 28), whiteMat, 0, 1.74, 0);
  band.rotation.x = Math.PI/2; g.add(band);                                                      // 腰带
  for (const s of [-1, 1]){                                                                      // 背后蝴蝶结
    const bow = mesh(new THREE.SphereGeometry(0.09, 12, 10), whiteMat, s*0.10, 1.78, -0.34);
    bow.scale.set(1.3, 0.8, 0.5); g.add(bow);
  }
  g.add(mesh(new THREE.SphereGeometry(0.05, 10, 8), whiteMat, 0, 1.78, -0.35));
  const collar = mesh(new THREE.TorusGeometry(0.155, 0.045, 10, 24), whiteMat, 0, 2.52, 0);
  collar.rotation.x = Math.PI/2; g.add(collar);                                                  // 领口
  for (const s of [-1, 1]){                                                                      // 泡泡袖
    const puff = mesh(new THREE.SphereGeometry(0.15, 14, 12), whiteMat, s*0.35, 2.32, 0);
    puff.scale.set(1, 0.8, 1); g.add(puff);
  }
  /* 头饰 */
  const hd = new THREE.Group(); hd.position.set(0, 3.44, 0); hd.rotation.x = 0.08; g.add(hd);
  hd.add(mesh(new THREE.CylinderGeometry(0.30, 0.30, 0.05, 24), whiteMat));
  const frill = mesh(new THREE.TorusGeometry(0.30, 0.05, 10, 28), whiteMat, 0, 0, 0);
  frill.rotation.x = Math.PI/2; hd.add(frill);
  for (const s of [-1, 1]){
    const b = mesh(new THREE.ConeGeometry(0.07, 0.16, 8), hairMat, s*0.09, 0.03, 0.24);
    b.rotation.z = s * 1.2; hd.add(b);
  }
}

/* ---- 2. 鲸鱼娘装 ---- */
let whaleTail;
{
  const g = newOutfit('whale');
  g.add(mesh(new THREE.CylinderGeometry(0.28, 0.32, 0.62, 20), hairMat, 0, 2.02, 0));            // 上衣
  g.add(lathe([[0.30,1.80],[0.44,1.50],[0.58,1.10],[0.70,0.78]], M(0x3b7de0), 28));               // 渐变裙
  const hem = mesh(new THREE.TorusGeometry(0.68, 0.035, 10, 32), hairLite, 0, 0.80, 0);
  hem.rotation.x = Math.PI/2; g.add(hem);
  const sash = mesh(new THREE.TorusGeometry(0.33, 0.035, 10, 28), hairLite, 0, 1.80, 0);
  sash.rotation.x = Math.PI/2; g.add(sash);                                                      // 腰带
  for (const s of [-1, 1]){                                                                      // 肩鳍
    const f = mesh(new THREE.ConeGeometry(0.10, 0.24, 8), hairLite, s*0.40, 2.36, 0);
    f.rotation.z = s * -1.1; g.add(f);
  }
  for (let i = 0; i < 10; i++){                                                                  // 珍珠项链
    const a = (i/10) * Math.PI * 2;
    g.add(mesh(new THREE.SphereGeometry(0.035, 10, 8), whiteMat, Math.cos(a)*0.17, 2.50, Math.sin(a)*0.17, false));
  }
  const pin = mesh(new THREE.ConeGeometry(0.08, 0.18, 8), hairLite, 0.33, 3.12, 0.12);
  pin.rotation.z = -0.9; g.add(pin);                                                             // 鳍发卡
  /* 鲸鱼尾（可摆动） */
  whaleTail = new THREE.Group(); whaleTail.position.set(0, 1.62, -0.38); g.add(whaleTail);
  for (const s of [-1, 1]){
    const fl = mesh(new THREE.ConeGeometry(0.17, 0.55, 8), hairDark, s*0.20, -0.10, -0.12);
    fl.scale.z = 0.35; fl.rotation.x = -0.7; fl.rotation.z = s * 0.75;
    whaleTail.add(fl);
  }
}

/* ---- 3. 休闲居家装 ---- */
{
  const g = newOutfit('casual');
  g.add(mesh(new THREE.CylinderGeometry(0.34, 0.40, 0.85, 20), deepBlue, 0, 1.98, 0));           // 卫衣
  g.add(mesh(new THREE.BoxGeometry(0.32, 0.24, 0.12), M(0x3d55d8), 0, 1.72, 0.30));              // 口袋
  const hood = mesh(new THREE.TorusGeometry(0.19, 0.085, 12, 24), deepBlue, 0, 2.50, -0.20);
  hood.rotation.x = 1.2; g.add(hood);                                                             // 帽子
  for (const s of [-1, 1])
    g.add(mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.30, 8), whiteMat, s*0.10, 2.15, 0.33, false)); // 抽绳
  g.add(lathe([[0.33,1.60],[0.46,1.32],[0.55,1.02]], M(0x2a3350), 24));                          // 短裙
  const stripe = mesh(new THREE.TorusGeometry(0.545, 0.02, 8, 28), whiteMat, 0, 1.04, 0);
  stripe.rotation.x = Math.PI/2; g.add(stripe);
  for (const s of [-1, 1])                                                                        // 堆堆袜
    g.add(mesh(new THREE.CylinderGeometry(0.125, 0.135, 0.40, 14), whiteMat, s*0.16, 0.62, 0.01));
  const star = mesh(new THREE.SphereGeometry(0.055, 8, 6), M(0xffd76b, { roughness:.4 }), 0.30, 3.10, 0.22, false);
  star.scale.set(1, 1, 0.5); g.add(star);                                                         // 星星发卡
}

/* 换装切换 */
function setOutfit(name){
  for (const k in outfits) outfits[k].visible = (k === name);
  for (const k in armExtras) armExtras[k].forEach(m => m.visible = (k === name));
  document.querySelectorAll('.outfit-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.outfit === name));
}
setOutfit('maid');

/* ============ 场景装饰 ============ */
{
  const podium = mesh(new THREE.CylinderGeometry(1.7, 1.85, 0.16, 40), M(0x1a2450, { roughness:.4 }), 0, -0.08, 0);
  podium.receiveShadow = true; scene.add(podium);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.7, 0.025, 10, 64),
    new THREE.MeshBasicMaterial({ color:0x38bdf8 }));
  ring.rotation.x = Math.PI/2; ring.position.y = 0.005; scene.add(ring);
  const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 32), M(0x0a0f24, { roughness:1 }));
  ground.rotation.x = -Math.PI/2; ground.position.y = -0.165;
  ground.receiveShadow = true; scene.add(ground);
}
/* 泡泡 */
const bubblesG = new THREE.Group(); bubblesG.visible = false; scene.add(bubblesG);
const bubbles = [];
{
  const bMat = new THREE.MeshBasicMaterial({ color:0x9fdcff, transparent:true, opacity:0.45 });
  for (let i = 0; i < 36; i++){
    const r = 0.02 + Math.random()*0.045;
    const b = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), bMat);
    b.position.set((Math.random()-0.5)*8, Math.random()*6.5, (Math.random()-0.5)*8);
    b.userData.speed = 0.25 + Math.random()*0.45;
    bubblesG.add(b); bubbles.push(b);
  }
}

/* ============ 交互 ============ */
let autoRotate = true, waving = false, waveT = 0;
document.querySelectorAll('.outfit-btn').forEach(b =>
  b.addEventListener('click', () => setOutfit(b.dataset.outfit)));
const btnRotate = document.getElementById('btnRotate');
const btnWave = document.getElementById('btnWave');
const btnBubbles = document.getElementById('btnBubbles');
btnRotate.addEventListener('click', () => { autoRotate = !autoRotate; btnRotate.classList.toggle('on', autoRotate); });
btnWave.addEventListener('click', () => { waving = !waving; btnWave.classList.toggle('on', waving); });
btnBubbles.addEventListener('click', () => { bubblesG.visible = !bubblesG.visible; btnBubbles.classList.toggle('on', bubblesG.visible); });
document.getElementById('btnReset').addEventListener('click', () => {
  camera.position.set(3.4, 2.9, 6.4); controls.target.set(0, 1.75, 0);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============ 动画 ============ */
const clock = new THREE.Clock();
let firstFrame = true;
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (autoRotate) feiyu.rotation.y += dt * 0.6;
  bodyG.position.y = Math.sin(t*2)*0.04;                       // 呼吸浮动
  headG.rotation.y = Math.sin(t*0.6)*0.10;
  headG.rotation.x = Math.sin(t*1.3)*0.03;
  tails.forEach(({ g, s }, i) => {                             // 双马尾摆动
    g.rotation.x = Math.sin(t*2.2 + i*1.7)*0.10;
    g.rotation.z = s * (0.06 + Math.sin(t*1.8 + i)*0.06);
  });
  if (whaleTail && outfits.whale.visible)                      // 鲸鱼尾摆动
    whaleTail.rotation.y = Math.sin(t*2.6)*0.35;

  waveT += ((waving ? 1 : 0) - waveT) * Math.min(dt*6, 1);      // 招手
  arms.R.rotation.z = 0.12 + waveT * (-2.17 + Math.sin(t*9)*0.45);
  arms.R.rotation.x = waveT * -0.15;
  headG.rotation.z = waveT * Math.sin(t*4.5)*0.10;

  if (bubblesG.visible) bubbles.forEach(b => {                 // 泡泡上升
    b.position.y += b.userData.speed * dt;
    if (b.position.y > 6.5) b.position.y = 0;
  });

  controls.update();
  renderer.render(scene, camera);
  if (firstFrame){
    firstFrame = false;
    const l = document.getElementById('loading');
    l.style.opacity = 0; setTimeout(() => l.remove(), 600);
  }
}
animate();
</script>
</body>
</html>
