<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============ 基础场景 ============ */
const container = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x16204a, 18, 42);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(3.6, 3.0, 6.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.8, 0);
controls.enableDamping = true;
controls.minDistance = 3; controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.55;

scene.add(new THREE.HemisphereLight(0xbdd8ff, 0x1a2340, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(5, 8, 6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6; key.shadow.camera.right = 6;
key.shadow.camera.top = 8; key.shadow.camera.bottom = -2;
scene.add(key);
const rim = new THREE.DirectionalLight(0x66c2ff, 0.9);
rim.position.set(-6, 4, -5); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffe0c0, 0.35);
fill.position.set(-3, 2, 6); scene.add(fill);

/* ============ 材质与工具 ============ */
const M = (color, o={}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness:.65, metalness:.05 }, o));
const skinMat  = M(0xffd9c2, { roughness:.55 });
const hairMat  = M(0x2f6bd8, { roughness:.5 });
const hairDark = M(0x1d469e, { roughness:.55 });
const hairLite = M(0x8fbdf5, { roughness:.5 });
const whiteMat = M(0xf7f9ff, { roughness:.6 });
const navyMat  = M(0x232a4a, { roughness:.7 });
const blackMat = M(0x1d2030, { roughness:.7 });
const eyeMat   = M(0x27407c, { roughness:.2 });
const hlMat    = new THREE.MeshBasicMaterial({ color:0xffffff });
const blushMat = M(0xff9db0, { roughness:.85 });
const mouthMat = M(0xb8546a, { roughness:.6 });
const goldMat  = M(0xd8b46a, { roughness:.35, metalness:.6 });

function mesh(geo, mat, x=0, y=0, z=0, shadow=true){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (shadow){ m.castShadow = true; m.receiveShadow = true; }
  return m;
}
function limb(p1, p2, r, mat){
  const a = new THREE.Vector3(...p1), b = new THREE.Vector3(...p2);
  const dir = b.clone().sub(a), len = dir.length();
  const g = new THREE.Group();
  const cyl = mesh(new THREE.CylinderGeometry(r, r*0.85, len, 14), mat);
  cyl.position.copy(a).lerp(b, .5);
  cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  g.add(cyl);
  g.add(mesh(new THREE.SphereGeometry(r, 14, 12), mat, ...a));
  g.add(mesh(new THREE.SphereGeometry(r*0.9, 14, 12), mat, ...b));
  return g;
}
function lathe(pts, mat, seg=28, phiStart=0, phiLen=Math.PI*2){
  const m = new THREE.Mesh(new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), seg, phiStart, phiLen), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function ring(r, tube, mat, y, seg=40){
  const m = mesh(new THREE.TorusGeometry(r, tube, 10, seg), mat, 0, y, 0);
  m.rotation.x = Math.PI/2; return m;
}
/* 小蝴蝶结 */
function bow(mat, s=1){
  const g = new THREE.Group();
  for (const sd of [-1, 1]){
    const w = mesh(new THREE.ConeGeometry(0.09*s, 0.16*s, 8), mat, sd*0.10*s, 0, 0);
    w.rotation.z = sd * 1.35; g.add(w);
  }
  g.add(mesh(new THREE.SphereGeometry(0.045*s, 10, 8), mat, 0, 0, 0.02*s, false));
  return g;
}
/* ============ 角色根 ============ */
const feiyu = new THREE.Group();
scene.add(feiyu);
const bodyG = new THREE.Group();
feiyu.add(bodyG);

/* ---- 头 ---- */
const headG = new THREE.Group();
headG.position.set(0, 2.82, 0);
bodyG.add(headG);
headG.add(mesh(new THREE.SphereGeometry(0.42, 32, 24), skinMat));

/* 脸：眼睛 / 高光 / 腮红 / 嘴（3 种表情切换） */
const eyes = [];
for (const s of [-1, 1]){
  const eg = new THREE.Group(); eg.position.set(s*0.165, 0.04, 0.35); headG.add(eg);
  const eye = mesh(new THREE.SphereGeometry(0.082, 18, 14), eyeMat);
  eye.scale.set(1, 1.4, 0.5); eg.add(eye);
  eg.add(mesh(new THREE.SphereGeometry(0.028, 10, 8), hlMat, -0.02, 0.035, 0.055, false));
  eg.add(mesh(new THREE.SphereGeometry(0.014, 8, 6), hlMat, 0.03, -0.03, 0.06, false));
  eyes.push(eg);
  const blush = mesh(new THREE.SphereGeometry(0.065, 12, 10), blushMat, s*0.285, -0.13, 0.30, false);
  blush.scale.set(1, 0.65, 0.4); headG.add(blush);
  /* 鲸鱼鳍耳 */
  const fin = mesh(new THREE.ConeGeometry(0.13, 0.34, 10), hairDark, s*0.47, 0.12, -0.03);
  fin.scale.z = 0.45; fin.rotation.z = s * -1.75; headG.add(fin);
  const finIn = mesh(new THREE.ConeGeometry(0.07, 0.20, 8), hairLite, s*0.45, 0.12, 0.01, false);
  finIn.scale.z = 0.4; finIn.rotation.z = s * -1.75; headG.add(finIn);
}
const mouthSmile = mesh(new THREE.TorusGeometry(0.05, 0.015, 8, 16, Math.PI), mouthMat, 0, -0.19, 0.385, false);
mouthSmile.rotation.z = Math.PI; headG.add(mouthSmile);
const mouthOpen = mesh(new THREE.SphereGeometry(0.055, 14, 12), M(0x8e3d4e, { roughness:.5 }), 0, -0.20, 0.375, false);
mouthOpen.scale.set(1.1, 1.25, 0.5); mouthOpen.visible = false; headG.add(mouthOpen);
function setExpr(e){
  eyes[0].children[0].scale.set(1, e === 'wink' ? 1.4 : 1.4, 0.5);
  eyes[1].children[0].scale.y = e === 'wink' ? 0.12 : 1.4;   // 右眼闭
  mouthSmile.visible = (e !== 'happy');
  mouthOpen.visible = (e === 'happy');
  document.querySelectorAll('[data-expr]').forEach(b => b.classList.toggle('on', b.dataset.expr === e));
}
setExpr('smile');

/* ---- 长发（参考图：及腰波浪长发） ---- */
const hairG = new THREE.Group(); bodyG.add(hairG);
hairG.add(mesh(new THREE.SphereGeometry(0.45, 24, 18), hairMat, 0, 2.98, -0.04));   // 顶发
const backHair = mesh(new THREE.SphereGeometry(0.46, 24, 18), hairDark, 0, 2.70, -0.16);
backHair.scale.set(1.0, 1.25, 0.9); hairG.add(backHair);
/* 脑后长发：5 节垂到腰际，S 形 */
const hairSway = [];
{
  let px = 0, py = 2.55, pz = -0.30;
  const rs = [0.34, 0.32, 0.29, 0.25, 0.20];
  rs.forEach((r, i) => {
    px = Math.sin(i*0.9)*0.06;
    const s = mesh(new THREE.SphereGeometry(r, 16, 14), i % 2 ? hairMat : hairDark, px, py, pz);
    s.scale.set(1, 1.25, 0.85); hairG.add(s);
    if (i >= 2) hairSway.push(s);
    py -= 0.34; pz -= 0.045;
  });
  const tip = mesh(new THREE.ConeGeometry(0.16, 0.4, 10), hairDark, px, py + 0.12, pz);
  tip.rotation.x = Math.PI; hairG.add(tip); hairSway.push(tip);
}
/* 两颊侧发 */
for (const s of [-1, 1]){
  let py = 2.95;
  [0.16, 0.14, 0.11].forEach((r, i) => {
    hairG.add(mesh(new THREE.SphereGeometry(r, 14, 12), hairMat, s*(0.38 - i*0.03), py, 0.10 - i*0.04));
    py -= 0.30;
  });
}
/* 刘海 */
for (let i = -3; i <= 3; i++){
  const bang = mesh(new THREE.ConeGeometry(0.075, 0.32, 8), hairMat, i*0.115, 3.10, 0.335);
  bang.rotation.x = 0.45; bang.rotation.z = -i*0.10; hairG.add(bang);
}
/* 呆毛 */
const ahoge = mesh(new THREE.TorusGeometry(0.09, 0.018, 8, 12, Math.PI*0.9), hairMat, 0.05, 3.44, -0.02, false);
ahoge.rotation.z = -0.4; hairG.add(ahoge);
/* 头饰：白色花边发箍 */
{
  const band = mesh(new THREE.TorusGeometry(0.44, 0.035, 10, 32, Math.PI), whiteMat, 0, 3.06, -0.02);
  band.rotation.x = -0.25; hairG.add(band);
  for (let i = 0; i <= 10; i++){
    const a = (i/10) * Math.PI;
    const f = mesh(new THREE.SphereGeometry(0.075, 10, 8), whiteMat,
      Math.cos(a)*0.45, 3.06 + Math.sin(a)*0.45*0.9, -0.02 - Math.sin(a)*0.06, false);
    f.scale.set(1, 0.75, 0.7); hairG.add(f);
  }
  const sideBow = bow(hairLite, 0.9); sideBow.position.set(-0.42, 3.22, 0.10);
  sideBow.rotation.y = 0.5; hairG.add(sideBow);
}

/* ---- 脖子 + 打底躯干 ---- */
bodyG.add(mesh(new THREE.CylinderGeometry(0.11, 0.13, 0.28, 14), skinMat, 0, 2.46, 0));
bodyG.add(mesh(new THREE.CylinderGeometry(0.25, 0.28, 0.75, 18), M(0xf3ede4), 0, 2.02, 0));

/* ---- 手臂（肩关节） ---- */
const arms = {};
for (const s of [-1, 1]){
  const sh = new THREE.Group(); sh.position.set(s*0.33, 2.32, 0); bodyG.add(sh);
  sh.add(limb([0, 0.02, 0], [s*0.05, -0.44, 0.02], 0.09, skinMat));
  sh.add(mesh(new THREE.SphereGeometry(0.10, 14, 12), skinMat, s*0.05, -0.48, 0.02));
  sh.rotation.z = s * 0.10;
  arms[s < 0 ? 'L' : 'R'] = sh;
}
/* ---- 腿（皮肤打底，各服装自行加袜子） ---- */
for (const s of [-1, 1])
  bodyG.add(limb([s*0.14, 1.66, 0], [s*0.15, 0.40, 0.01], 0.11, skinMat));

/* ============ 换装系统 ============ */
const OUTFITS = [];
const outfits = {};
const armExtras = {};
function newOutfit(id, name, tag, tagLabel, desc){
  const g = new THREE.Group(); g.visible = false; bodyG.add(g);
  outfits[id] = g; armExtras[id] = [];
  OUTFITS.push({ id, name, tag, tagLabel, desc });
  return g;
}
function armAdd(outfitId, s, m){
  m.visible = false;
  arms[s < 0 ? 'L' : 'R'].add(m);
  armExtras[outfitId].push(m);
}
/* 小鲸鱼印花（围裙用 Canvas 纹理） */
function whaleTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#f7f9ff'; x.fillRect(0, 0, 256, 256);
  x.fillStyle = '#2f6bd8';
  x.beginPath(); x.ellipse(128, 140, 70, 45, 0, 0, Math.PI*2); x.fill();
  x.beginPath(); x.moveTo(188,128); x.lineTo(236,98); x.lineTo(226,140); x.lineTo(236,178); x.lineTo(188,156); x.closePath(); x.fill();
  x.fillStyle = '#bcd6ff';
  x.beginPath(); x.ellipse(128, 158, 48, 26, 0, 0, Math.PI*2); x.fill();
  x.fillStyle = '#1c2b4a'; x.beginPath(); x.arc(95, 128, 7, 0, Math.PI*2); x.fill();
  x.strokeStyle = '#2f6bd8'; x.lineWidth = 6; x.lineCap = 'round';
  x.beginPath(); x.moveTo(126,92); x.quadraticCurveTo(118,68,102,60); x.stroke();
  x.beginPath(); x.moveTo(134,92); x.quadraticCurveTo(142,68,158,60); x.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const whaleTex = whaleTexture();
const apronPrintMat = new THREE.MeshStandardMaterial({ map: whaleTex, roughness:.7 });

/* ---- 1. 经典女仆装（还原参考图）[还原] ---- */
let maidTail;
{
  const g = newOutfit('maid', '🎀 经典女仆装', 'cool', '还原', '深海蓝长裙配小鲸鱼围裙，肥鱼的本体打扮');
  g.add(mesh(new THREE.CylinderGeometry(0.26, 0.30, 0.60, 20), navyMat, 0, 2.04, 0));   // 紧身衣
  for (const s of [-1, 1]){                                                              // 长袖+袖口（跟随手臂）
    armAdd('maid', s, mesh(new THREE.CylinderGeometry(0.115, 0.105, 0.42, 14), navyMat, s*0.025, -0.19, 0.01));
    armAdd('maid', s, mesh(new THREE.CylinderGeometry(0.11, 0.12, 0.10, 14), whiteMat, s*0.045, -0.40, 0.02));
    const cf = mesh(new THREE.TorusGeometry(0.115, 0.035, 8, 18), whiteMat, s*0.045, -0.44, 0.02);
    cf.rotation.x = Math.PI/2; armAdd('maid', s, cf);

/* ============ 场景主题 ============ */
const SCENES = {
  ocean: { bg:'linear-gradient(180deg,#0b1026 0%,#16204a 45%,#274b8f 75%,#3d7dd6 100%)', fog:0x16204a, ground:0x0a0f24, ring:0x38bdf8, bubble:0x9fdcff },
  night: { bg:'linear-gradient(180deg,#05030f 0%,#141031 50%,#2b1f5e 80%,#4a2f8f 100%)', fog:0x141031, ground:0x0b0918, ring:0xc9a7ff, bubble:0xd6c2ff },
  sakura:{ bg:'linear-gradient(180deg,#2b0f22 0%,#5e2140 45%,#a04a6e 75%,#e89bb8 100%)', fog:0x5e2140, ground:0x241019, ring:0xffb7d5, bubble:0xffc9dd },
};
function applyScene(name){
  const s = SCENES[name];
  document.body.style.background = s.bg;
  scene.fog.color.set(s.fog);
  groundMat.color.set(s.ground);
  podiumRing.material.color.set(s.ring);
  bubbleMat.color.set(s.bubble);
  document.querySelectorAll('[data-scene]').forEach(b => b.classList.toggle('on', b.dataset.scene === name));
}

/* ============ 换装 UI ============ */
const outfitList = document.getElementById('outfitList');
OUTFITS.forEach(o => {
  const b = document.createElement('button');
  b.className = 'outfit-btn'; b.dataset.outfit = o.id;
  b.innerHTML = `<span>${o.name}</span><span class="tag ${o.tag}">${o.tagLabel}</span>`;
  b.addEventListener('click', () => setOutfit(o.id));
  outfitList.appendChild(b);
});
function setOutfit(id){
  for (const k in outfits) outfits[k].visible = (k === id);
  for (const k in armExtras) armExtras[k].forEach(m => m.visible = (k === id));
  const o = OUTFITS.find(x => x.id === id);
  document.getElementById('capName').textContent = o.name;
  document.getElementById('capDesc').textContent = o.desc;
  document.querySelectorAll('.outfit-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.outfit === id));
}

/* ============ 交互 ============ */
let autoRotate = true, waving = false, waveT = 0;
document.querySelectorAll('[data-expr]').forEach(b =>
  b.addEventListener('click', () => setExpr(b.dataset.expr)));
document.querySelectorAll('[data-scene]').forEach(b =>
  b.addEventListener('click', () => applyScene(b.dataset.scene)));
const btnRotate = document.getElementById('btnRotate');
const btnWave = document.getElementById('btnWave');
const btnBubbles = document.getElementById('btnBubbles');
btnRotate.addEventListener('click', () => { autoRotate = !autoRotate; btnRotate.classList.toggle('on', autoRotate); });
btnWave.addEventListener('click', () => { waving = !waving; btnWave.classList.toggle('on', waving); });
btnBubbles.addEventListener('click', () => { bubblesG.visible = !bubblesG.visible; btnBubbles.classList.toggle('on', bubblesG.visible); });
document.getElementById('btnReset').addEventListener('click', () => {
  camera.position.set(3.6, 3.0, 6.8); controls.target.set(0, 1.8, 0);
});
document.getElementById('btnPhoto').addEventListener('click', () => {
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.href = renderer.domElement.toDataURL('image/png');
  a.download = 'feiyu.png'; a.click();
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============ 动画 ============ */
const clock = new THREE.Clock();
let firstFrame = true;
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (autoRotate) feiyu.rotation.y += dt * 0.6;
  bodyG.position.y = Math.sin(t*2)*0.04;
  headG.rotation.y = Math.sin(t*0.6)*0.10;
  headG.rotation.x = Math.sin(t*1.3)*0.03;
  hairSway.forEach((m, i) => {                                   // 长发摆动
    m.rotation.z = Math.sin(t*2 + i*0.8)*0.07;
    m.rotation.x = Math.sin(t*1.6 + i*0.6)*0.05;
  });
  ahoge.rotation.z = -0.4 + Math.sin(t*3)*0.12;
  if (maidTail && outfits.maid.visible) maidTail.rotation.y = Math.sin(t*2.4)*0.30;
  if (whaleTail && outfits.whale.visible) whaleTail.rotation.y = Math.sin(t*2.6)*0.35;

  waveT += ((waving ? 1 : 0) - waveT) * Math.min(dt*6, 1);        // 招手
  arms.R.rotation.z = 0.10 + waveT * (-2.15 + Math.sin(t*9)*0.45);
  arms.R.rotation.x = waveT * -0.15;
  headG.rotation.z = waveT * Math.sin(t*4.5)*0.10;

  if (bubblesG.visible) bubbles.forEach(b => {
    b.position.y += b.userData.speed * dt;
    if (b.position.y > 6.5) b.position.y = 0;
  });

  controls.update();
  renderer.render(scene, camera);
  if (firstFrame){
    firstFrame = false;
    const l = document.getElementById('loading');
    l.style.opacity = 0; setTimeout(() => l.remove(), 600);
  }
}
setOutfit('maid');
applyScene('ocean');
animate();
</script>
